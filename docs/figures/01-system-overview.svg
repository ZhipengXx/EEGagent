<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Two studies. One research workbench.</title>
<desc id="desc">Separate EEG/MEG retrieval and fMRI screening workflows share a local workbench. Neither workflow automatically feeds into the other.</desc>
