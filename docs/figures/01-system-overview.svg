<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">One workbench. Two research loops.</title><desc id="desc">A local workbench and CLI expose two independent loops. fMRI uses a planner, screening tools, reports and episode memory. EEG uses eight LLM roles coordinated by a campaign runtime, training tools and evidence records. The separate ReAct chat entry is not a third research loop. No automatic screening-to-training connection is shown.</desc>
