<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="828" viewBox="0 0 1440 828" role="img" aria-labelledby="title desc">
<title id="title">Planning over alternatives</title>
<desc id="desc">Illustrative next-action options in one planner response; one selected action passes runtime checks before dispatch.</desc>
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#203744"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#35756E"/></marker>
<marker id="arrow-rust" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#AE663B"/></marker>
</defs>
<rect width="1440" height="828" fill="#F7F4EE"/>
<text x="54" y="47" fill="#5C6C70" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" letter-spacing="2">EEGagent  /  BRAIN DECODING RESEARCH</text>
<text x="1385" y="47" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="end" letter-spacing="0">04</text>
<text x="54" y="109" fill="#203744" font-family="DejaVu Serif" font-size="43" font-weight="normal" text-anchor="start" letter-spacing="0">Compare before committing.</text>
<text x="54" y="150" fill="#5C6C70" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" letter-spacing="0">2–4 candidate next actions, one selected research decision.</text>
