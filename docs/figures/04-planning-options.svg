<text x="1064" y="445" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">Legal action / eligible target</text>
<text x="1064" y="470" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">Evidence / required gates</text>
