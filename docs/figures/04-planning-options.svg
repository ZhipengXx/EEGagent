<text x="330" y="207" fill="#5C6C70" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" letter-spacing="1.6">CANDIDATE NEXT ACTIONS</text>
<text x="1386" y="207" fill="#35756E" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="end" letter-spacing="1.4">ONE PLANNER CALL</text>
