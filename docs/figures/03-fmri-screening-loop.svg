<path d="M516 801 H1386" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="516" y="837" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">CHECKS  /  numeric · temporal · surface &amp; ROI · reference · specificity</text>
<text x="516" y="872" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">Optional semantic / CortexMAE checks depend on configuration and assets.</text>
<text x="54" y="925" fill="#35756E" font-family="DejaVu Sans Mono" font-size="22" font-weight="normal" text-anchor="start" letter-spacing="0">REPORT SCOPE  /  numeric_consistency_only</text>
<path d="M54 950 H1386" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="54" y="987" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">Screening evidence stays in the fMRI workflow. It does not become EEG training data automatically.</text>
