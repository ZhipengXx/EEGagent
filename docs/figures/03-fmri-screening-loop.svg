<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1238" viewBox="0 0 1440 1238" role="img" aria-labelledby="title desc">
<title id="title">How fMRI screening closes the loop</title><desc id="desc">An image can be converted to a stimulus video and predicted fMRI by an external TRIBE worker with matched gray control, or an existing series can be ingested directly. Required checks run before the evidence ledger. A rule policy or LLM planner selects an action, deterministic validation checks resource and budget constraints, and a registered tool executes. Evidence returns to the planner until finalization. A report is written and an episode stored; an optional curator can propose lessons for future planning. The claim scope is numeric consistency only.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8292A8"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7354CF"/></marker>
</defs>
