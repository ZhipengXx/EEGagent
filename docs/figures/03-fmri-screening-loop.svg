<text x="80" y="636" fill="#203744" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start" letter-spacing="0">Ingest + required checks</text>
<text x="80" y="679" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Establish the initial evidence.</text>
<text x="80" y="744" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">Activity colors are schematic.</text>
<rect x="516" y="201" width="399" height="219" rx="0" fill="#FFFDFA" stroke="#CCCFC7" stroke-width="1.2"/>
<text x="543" y="245" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">PLAN</text>
<text x="543" y="287" fill="#203744" font-family="DejaVu Serif" font-size="29" font-weight="normal" text-anchor="start" letter-spacing="0">Select the next check</text>
<text x="543" y="329" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Rule policy or configured LLM</text>
<text x="543" y="371" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Read evidence and open questions.</text>
<rect x="987" y="201" width="399" height="219" rx="0" fill="#FFFDFA" stroke="#CCCFC7" stroke-width="1.2"/>
<text x="1014" y="245" fill="#35756E" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">VALIDATE + EXECUTE</text>
<text x="1014" y="287" fill="#203744" font-family="DejaVu Serif" font-size="29" font-weight="normal" text-anchor="start" letter-spacing="0">Measure the response</text>
<text x="1014" y="329" fill="#5C6C70" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" letter-spacing="0">Runtime validates each action first.</text>
<text x="1014" y="371" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Run tools with available resources.</text>
<rect x="987" y="493" width="399" height="218" rx="0" fill="#FFFDFA" stroke="#CCCFC7" stroke-width="1.2"/>
<text x="1014" y="537" fill="#35756E" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">OBSERVE</text>
<text x="1014" y="579" fill="#203744" font-family="DejaVu Serif" font-size="29" font-weight="normal" text-anchor="start" letter-spacing="0">Update the evidence</text>
<text x="1014" y="621" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Measurements + question ledger</text>
<text x="1014" y="662" fill="#5C6C70" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" letter-spacing="0">Continue, or finalize within policy.</text>
<rect x="516" y="493" width="399" height="218" rx="0" fill="#FFFDFA" stroke="#CCCFC7" stroke-width="1.2"/>
<text x="543" y="537" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">FINALIZE WHEN READY</text>
<text x="543" y="579" fill="#203744" font-family="DejaVu Serif" font-size="29" font-weight="normal" text-anchor="start" letter-spacing="0">Write the report</text>
<text x="543" y="618" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Verdict + screening decision</text>
<text x="543" y="648" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Stop reason + memory episode</text>
<text x="543" y="683" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">Optional curation of scoped lessons</text>
