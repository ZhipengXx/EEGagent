<text x="48" y="108" font-size="38" fill="#17263D" font-weight="700" text-anchor="start">How fMRI screening closes the loop</text>
<text x="48" y="144" font-size="19" fill="#62728A" font-weight="400" text-anchor="start">Planning selects checks; deterministic tools produce evidence and the runtime enforces the screening scope.</text>
