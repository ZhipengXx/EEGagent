<text x="80" y="486" fill="#203744" font-family="DejaVu Serif" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Existing fMRI series</text>
<text x="80" y="527" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">or image → TRIBE + gray control</text>
<text x="80" y="558" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">External resources required.</text>
