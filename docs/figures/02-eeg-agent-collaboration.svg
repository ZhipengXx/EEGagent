<text x="720" y="292" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" letter-spacing="0">draft</text>
<path d="M1085 561 V622" fill="none" stroke="#AE663B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-rust)"/>
<text x="1105" y="602" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">ready</text>
<path d="M785 887 H663" fill="none" stroke="#AE663B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7" marker-end="url(#arrow-rust)"/>
<text x="720" y="858" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" letter-spacing="0">findings</text>
<path d="M351 630 V569" fill="none" stroke="#35756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
<text x="330" y="602" fill="#5C6C70" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="end" letter-spacing="0">scoped memory</text>
<path d="M785 743 H734 V382 H663" fill="none" stroke="#35756E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
<rect x="54" y="1015" width="1332" height="37" rx="0" fill="#203744" stroke="#203744" stroke-width="1.2"/>
<text x="720" y="1041" fill="#FFFDFA" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" letter-spacing="0">CAMPAIGN RECORDS  /  versioned plans · attempts · jobs · comparisons · conditional lessons</text>
<path d="M54 1070 H1386" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="54" y="1107" fill="#5C6C70" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" letter-spacing="0">Representative handoffs, mediated by the runtime. Roles are invoked as needed; pilot evidence remains pilot-level.</text>
