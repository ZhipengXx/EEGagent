<text x="80" y="248" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">01  /  FRAME THE QUESTION</text>
<circle cx="85" cy="283" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="103" y="291" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Research Planner</text>
<text x="103" y="320" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Choose an action using evidence and budget.</text>
<circle cx="85" cy="366" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="103" y="374" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Research Librarian</text>
<text x="103" y="403" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Bring local methods and applicability limits.</text>
<circle cx="85" cy="449" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="103" y="457" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Experiment Designer</text>
<text x="103" y="486" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Turn a hypothesis into a controlled experiment.</text>
<path d="M80 516 H627" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="80" y="544" fill="#35756E" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Study contract  /  split · gallery · metric · seeds</text>
<text x="811" y="248" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">02  /  BUILD THE CANDIDATE</text>
<circle cx="816" cy="291" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="834" y="299" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Candidate Coder</text>
<text x="834" y="328" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Implement an isolated extension.</text>
<circle cx="816" cy="388" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="834" y="396" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Candidate Reviewer</text>
<text x="834" y="425" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Check the implementation; request repairs.</text>
<path d="M1297 395 H1348 V298 H1310" fill="none" stroke="#AE663B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7" marker-end="url(#arrow-rust)"/>
<path d="M811 468 H1360" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="811" y="506" fill="#35756E" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Runtime approval binds the experiment context.</text>
<text x="811" y="540" fill="#5C6C70" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="start" letter-spacing="0">Supported hooks + source and configuration identity</text>
<text x="811" y="671" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">03  /  READ THE EVIDENCE</text>
<circle cx="816" cy="709" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="834" y="717" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Result Analyst</text>
<text x="834" y="746" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Interpret matched comparisons and diagnostics.</text>
<path d="M811 772 H1360" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="811" y="811" fill="#35756E" font-family="DejaVu Serif" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Runtime  /  train → settle → compare</text>
<text x="811" y="851" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Baseline, pilot, full run or replication as selected.</text>
<text x="811" y="889" fill="#5C6C70" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" letter-spacing="0">Fixed validation gallery. Declared confirmation policy.</text>
<text x="811" y="949" fill="#203744" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" letter-spacing="0">Findings return to planning — including negative ones.</text>
<text x="80" y="671" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="17" font-weight="normal" text-anchor="start" letter-spacing="0">04  /  RETAIN WHAT IS SUPPORTED</text>
<circle cx="85" cy="715" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="103" y="723" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Result Auditor</text>
<text x="103" y="752" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Check draft claims against the latest result.</text>
<circle cx="85" cy="811" r="4" fill="#203744" stroke="none" stroke-width="1"/>
<text x="103" y="819" fill="#203744" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" letter-spacing="0">Memory Curator</text>
<text x="103" y="848" fill="#5C6C70" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Propose lessons with conditions and evidence.</text>
<path d="M80 884 H627" fill="none" stroke="#CCCFC7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="80" y="922" fill="#35756E" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" letter-spacing="0">Runtime  /  audit freshness + lesson acceptance</text>
<text x="80" y="955" fill="#5C6C70" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" letter-spacing="0">Records preserve scope, dependencies and limits.</text>
