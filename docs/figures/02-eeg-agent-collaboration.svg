<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title desc">
<title id="title">The brain decoding research loop</title>
<desc id="desc">Eight LLM roles are grouped by research stage around an EEG-to-image retrieval study. The campaign runtime routes every handoff. Arrows show representative stages, not fixed execution order, direct messages, or parallel autonomous processes.</desc>
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#203744"/></marker>
