<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1405" viewBox="0 0 1440 1405" role="img" aria-labelledby="title desc">
<title id="title">How the EEG research roles collaborate</title><desc id="desc">The Research Planner uses state, data diagnostics and evidence. The Research Librarian returns local method cards. The Experiment Designer proposes a draft that deterministic runtime validation must approve. The Candidate Coder and Candidate Reviewer iterate on an isolated extension. Training and evaluation produce comparable evidence; the Result Analyst feeds findings back to planning. The Result Auditor receives a claim draft and latest result summary; runtime code tracks audit freshness from campaign evidence. The Memory Curator proposes conditional lessons. All handoffs are mediated by campaign records, task identity and artifact hashes; this is not a fixed chain or free-form agent chat.</desc>
