<text x="1385" y="47" fill="#AE663B" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="end" letter-spacing="0">02</text>
<text x="54" y="109" fill="#203744" font-family="DejaVu Serif" font-size="43" font-weight="normal" text-anchor="start" letter-spacing="0">Inside an EEG decoding study.</text>
<text x="54" y="150" fill="#5C6C70" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" letter-spacing="0">Eight roles, coordinated through campaign state, controls and recorded evidence.</text>
