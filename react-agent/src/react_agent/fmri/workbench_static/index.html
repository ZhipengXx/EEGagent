<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEGagent · Brain Decoding Lab</title>
<!-- 检索实验工作台：代码级自主研究为默认入口 -->
<link rel="stylesheet" href="/static/app.css?v=ws9">
</head>
<body data-surface="agentic">
<div class="app">
<header class="top">
  <button type="button" id="toggle-side" aria-label="Open navigation" aria-expanded="false">Menu</button>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 44 28" aria-hidden="true"><path d="M2 14h8l5-9 6 19 5-10h16"/></svg>
    EEGagent
    <span class="brand-sub">BRAIN DECODING LAB</span>
  </div>
  <span id="demo-indicator" class="demo-indicator" hidden>DEMO · SYNTHETIC DATA</span>
  <div id="header-status" class="header-status"></div>
  <button type="button" id="open-drawer">New screening</button>
</header>
<div class="body">
  <aside class="side" id="sidebar">
    <button type="button" id="surface-create" class="primary new-research">+ New research</button>
    <p class="nav-heading">WORKSPACE</p>
    <nav class="mode-switch" aria-label="Workspace">
      <button type="button" id="surface-agentic" class="active">Autonomous research</button>
      <button type="button" id="surface-screen">fMRI screening</button>
      <button type="button" id="surface-adaptive">Baseline experiments</button>
    </nav>
    <div class="side-records">
      <label class="search-label nav-heading" for="search" id="side-label">RESEARCH CAMPAIGNS</label>
      <input id="search" type="search" placeholder="Find a campaign…" autocomplete="off">
      <div id="run-list" class="run-list"></div>
    </div>
    <footer id="side-context" class="side-context"></footer>
  </aside>
  <main id="main"></main>
</div>
</div>
<div id="drawer" class="drawer" hidden aria-hidden="true">
  <div class="drawer-panel" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">新建 fMRI 筛查</h2>
      <button type="button" id="close-drawer" class="ghost" aria-label="关闭新建筛查">关闭</button>
    </div>
    <form id="run-form">
      <label for="image_path">服务器图片路径</label>
      <input id="image_path" name="image_path" spellcheck="false" autocomplete="off" placeholder="/path/to/image.jpg">
      <p id="image-preview" class="hint"></p>
      <label for="check_mode">筛查模式</label>
      <select id="check_mode" name="check_mode">
        <option value="quick">快速数值筛查</option>
        <option value="diagnostic">分层数值筛查</option>
      </select>
      <p id="mode-note" class="hint"></p>
      <p id="mode-resolved" class="hint"></p>
      <label for="screen_depth">筛查深度</label>
      <select id="screen_depth" name="screen_depth">
        <option value="standard">标准筛查：只跑第一层，更快</option>
        <option value="deep">深层筛查：加跑 ROI、跨图特异性、参考分布、图文一致性</option>
      </select>
      <p id="depth-note" class="hint"></p>
      <details>
        <summary>高级设置</summary>
        <label for="sample_id">sample_id（可空）</label>
        <input id="sample_id" name="sample_id" autocomplete="off">
        <label for="out_dir">输出目录（runs/ 下）</label>
        <input id="out_dir" name="out_dir" value="workbench" autocomplete="off">
        <label for="config">配置文件</label>
        <select id="config" name="config"></select>
        <label for="policy">policy（空则跟配置）</label>
        <select id="policy" name="policy">
          <option value="">跟配置</option>
          <option value="rule">rule</option>
          <option value="hybrid">hybrid</option>
          <option value="planned">planned</option>
        </select>
        <label for="backend">backend（空则跟配置）</label>
        <select id="backend" name="backend">
          <option value="">跟配置</option>
          <option value="none">none</option>
          <option value="mock">mock</option>
          <option value="deepseek">deepseek</option>
        </select>
      </details>
      <p id="form-error" class="error" role="alert"></p>
      <div class="drawer-footer">
        <p class="hint">页面不显示密钥。没有取消接口，运行中只能查看状态。</p>
        <button type="submit" id="start-check">开始筛查</button>
      </div>
    </form>
  </div>
</div>
<div id="explain" class="drawer" hidden aria-hidden="true">
  <div class="drawer-panel explain-panel" role="dialog" aria-labelledby="explain-title">
    <div class="drawer-head">
      <h2 id="explain-title">指标解释</h2>
      <button type="button" id="close-explain" class="ghost" aria-label="关闭指标解释">关闭</button>
    </div>
    <div id="explain-body"></div>
  </div>
</div>
<script src="/static/app.js?v=ws9"></script>
</body>
</html>
